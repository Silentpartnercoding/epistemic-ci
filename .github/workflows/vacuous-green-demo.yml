name: vacuous-green-demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vacuous-green-demo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ordinary-ci:
    name: ordinary-ci-stays-green
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Run the intentionally vacuous ordinary check
        working-directory: examples/vacuous-green
        run: python3 ordinary_ci.py

  epistemic-ci:
    name: epistemic-ci-catches-vacuity
    needs: ordinary-ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Epistemic CI
        run: python -m pip install --disable-pip-version-check -e .
      - name: Assert the expected green-versus-vacuous contrast
        run: python -m unittest tests.test_vacuous_green_demo -v
      - name: Explain the result
        run: |
          echo '### Vacuous-green comparison' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Ordinary CI: **passed**.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Planted source defect: **survived** the ordinary verifier.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Epistemic CI: **detected the vacuous verification path**.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'This synthetic fixture demonstrates detection; it does not certify an external project.' >> "$GITHUB_STEP_SUMMARY"
