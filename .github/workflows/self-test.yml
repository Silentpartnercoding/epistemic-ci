name: self-test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Run unit and adversarial tests
        run: python -m unittest discover -s tests -v
      - name: Verify installed package
        run: |
          epistemic-ci --help
          python -m pip check
      - name: Run demonstration
        run: epistemic-ci run --root examples/demo --config .epistemic-ci.json --output epistemic-ci-result.json

  action:
    name: local-action
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Exercise the published Action surface
        uses: ./
        with:
          root: examples/demo
          config: .epistemic-ci.json
          output: epistemic-ci-result.json
