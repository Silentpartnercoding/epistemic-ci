name: Epistemic CI
description: Test whether a declared computational-research verification path is non-vacuous
author: Silentpartnercoding

branding:
  icon: check-circle
  color: purple

inputs:
  root:
    description: Repository-relative directory containing the verification project
    required: false
    default: .
  config:
    description: Config path relative to root
    required: false
    default: .epistemic-ci.json
  output:
    description: Result path relative to root
    required: false
    default: epistemic-ci-result.json
  python-version:
    description: Python version used to run Epistemic CI
    required: false
    default: "3.11"

outputs:
  result-path:
    description: Path supplied to the Epistemic CI result writer
    value: ${{ steps.run.outputs.result-path }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install Epistemic CI
      shell: bash
      run: python -m pip install --disable-pip-version-check "${{ github.action_path }}"
    - name: Run Epistemic CI
      id: run
      shell: bash
      env:
        EPISTEMIC_CI_ROOT: ${{ inputs.root }}
        EPISTEMIC_CI_CONFIG: ${{ inputs.config }}
        EPISTEMIC_CI_OUTPUT: ${{ inputs.output }}
      run: |
        epistemic-ci run \
          --root "$EPISTEMIC_CI_ROOT" \
          --config "$EPISTEMIC_CI_CONFIG" \
          --output "$EPISTEMIC_CI_OUTPUT"
        printf 'result-path=%s/%s\n' "$EPISTEMIC_CI_ROOT" "$EPISTEMIC_CI_OUTPUT" >> "$GITHUB_OUTPUT"
